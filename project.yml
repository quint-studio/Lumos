name: Lumos
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  Lumos:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Lumos
    resources:
      - path: Lumos/Resources/notification_bridge.js
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.lumos
        INFOPLIST_FILE: Lumos/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Lumos/Resources/Lumos.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
