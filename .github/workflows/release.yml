name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security unlock-keychain -p "" build.keychain
          # Add to search list (quan trọng — thiếu cái này xcodebuild không tìm thấy cert)
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security import /tmp/cert.p12 -k build.keychain -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          rm /tmp/cert.p12

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}   # v1.0.2 → 1.0.2
          BUILD=${{ github.run_number }}

          xcodebuild archive \
            -project Lumos.xcodeproj \
            -scheme Lumos \
            -configuration Release \
            -archivePath Lumos.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD"

      - name: Export & Sign
        env:
          TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
        run: |
          # Copy app ra khỏi archive
          mkdir -p export
          cp -r "Lumos.xcarchive/Products/Applications/Lumos.app" export/

          SIGN_ID="Developer ID Application"
          APP="export/Lumos.app"
          SPARKLE_B="$APP/Contents/Frameworks/Sparkle.framework/Versions/B"

          # Ký từ trong ra ngoài — chỉ qua Versions/B (tránh ký lại qua symlink Current)
          # 1. Ký nested .app và .xpc bên trong Versions/B
          find "$SPARKLE_B" \( -name "*.xpc" -o -name "*.app" \) | while read bundle; do
            codesign --force --options runtime \
              --sign "$SIGN_ID" \
              --keychain build.keychain \
              "$bundle"
          done

          # 2. Ký Versions/B (actual framework bundle)
          codesign --force --options runtime \
            --sign "$SIGN_ID" \
            --keychain build.keychain \
            "$SPARKLE_B"

          # 3. Ký Lumos.app (outer bundle)
          codesign --force --options runtime \
            --entitlements Lumos/Resources/Lumos.entitlements \
            --sign "$SIGN_ID" \
            --keychain build.keychain \
            "$APP"

          # Verify outer bundle (không dùng --deep vì versioned framework gây ambiguous)
          codesign --verify --verbose "$APP"

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARYTOOL_APP_PASSWORD }}
        run: |
          # Zip app để submit (notarytool không nhận .app trực tiếp)
          ditto -c -k --keepParent export/Lumos.app export/Lumos.zip

          xcrun notarytool submit export/Lumos.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" \
            --wait

          # Staple ticket vào .app gốc
          xcrun stapler staple export/Lumos.app

      - name: Create DMG
        run: |
          TAG=${GITHUB_REF_NAME}
          bash scripts/create_dmg.sh "Lumos-${TAG}.dmg"

      - name: Generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          TAG=${GITHUB_REF_NAME}
          DMG_FILE="Lumos-${TAG}.dmg"

          # Download Sparkle tools
          SPARKLE_VERSION="2.6.4"
          curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            -o sparkle.tar.xz
          mkdir -p sparkle_tools
          tar -xf sparkle.tar.xz -C sparkle_tools

          # Write private key to temp file
          echo "$SPARKLE_PRIVATE_KEY" > /tmp/sparkle_private_key

          # Generate appcast entry for this release
          ./sparkle_tools/bin/generate_appcast \
            --ed-key-file /tmp/sparkle_private_key \
            --download-url-prefix "https://github.com/quint-studio/Lumos/releases/download/${TAG}/" \
            --link "https://github.com/quint-studio/Lumos/releases/tag/${TAG}" \
            --full-release-notes-url "https://github.com/quint-studio/Lumos/releases/tag/${TAG}" \
            --maximum-versions 10 \
            .

          rm /tmp/sparkle_private_key

      - name: Commit appcast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout master
          git add appcast.xml
          git diff --cached --quiet || git commit -m "chore: update appcast for ${GITHUB_REF_NAME}"
          git push origin master

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Lumos-*.dmg
          generate_release_notes: true
